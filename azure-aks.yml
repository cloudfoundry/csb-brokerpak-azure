---
version: 1
name: csb-azure-aks
id: 7d8f1f2a-40d4-4c7e-99ac-68c79dced412
description: |
  Managed Azure Kubernetes Service cluster for short-lived sandbox workloads.
  Each instance has a dedicated resource group, virtual network, subnet, and
  three-node system pool. Bindings return metadata and identity-based CLI
  instructions only; no Kubernetes credentials are returned.
display_name: CSB Azure Kubernetes Service
image_url: file://service-images/csb.png
documentation_url: https://learn.microsoft.com/azure/aks/
provider_display_name: Microsoft Azure
support_url: https://azure.microsoft.com/products/kubernetes-service/
tags: [azure, aks, kubernetes, containers, sandbox]
plan_updateable: false
plans:
- name: sandbox-3-node
  id: f14d898f-6cf5-4992-a19d-cfb9ef97b79c
  description: |
    Eight-hour sandbox cluster with one fixed-size, three-node system pool,
    managed identity, OIDC issuer, workload identity, Azure CNI Overlay,
    Cilium data plane, and Standard load balancer. The API is private by
    default; public API access requires an explicit CIDR allowlist.
  display_name: Sandbox 3-node
  properties:
    ttl_hours: 8
    node_count: 3
    node_vm_size: Standard_D2_v5
provision:
  plan_inputs:
  - field_name: ttl_hours
    type: number
    details: Instance lifetime metadata in hours. This plan fixes the value at 8.
    default: 8
  - field_name: node_count
    type: number
    details: Fixed system pool size. This plan fixes the value at 3 and disables autoscaling.
    default: 3
  - field_name: node_vm_size
    type: string
    details: Virtual machine size for the system node pool.
    default: Standard_D2_v5
  user_inputs:
  - field_name: instance_name
    type: string
    details: Name prefix for the AKS cluster and dedicated network resources.
    default: csb-aks-${request.instance_id}
    constraints:
      maxLength: 40
      minLength: 3
      pattern: ^[a-z][a-z0-9-]+[a-z0-9]$
    prohibit_update: true
  - field_name: location
    type: string
    details: Azure region for the cluster and its dedicated resources.
    default: eastus2
    constraints:
      examples:
      - eastus2
      - westus2
      pattern: ^[a-z][a-z0-9]+$
    prohibit_update: true
  - field_name: resource_group
    type: string
    details: Dedicated resource group created and exclusively managed for this instance.
    default: csb-aks-${request.instance_id}
    prohibit_update: true
  - field_name: private_cluster_enabled
    type: boolean
    details: Use a private Kubernetes API endpoint. Set false only for demo management with authorized_api_server_cidrs configured.
    default: true
    prohibit_update: true
  - field_name: authorized_api_server_cidrs
    type: array
    details: Explicit CIDR allowlist for a public Kubernetes API. Must be empty for private clusters and non-empty for public clusters.
    default: []
    prohibit_update: true
  - field_name: vnet_address_space
    type: array
    details: Address space for the dedicated virtual network.
    default: [10.240.0.0/16]
    prohibit_update: true
  - field_name: subnet_address_prefixes
    type: array
    details: Address prefixes for the dedicated AKS subnet.
    default: [10.240.0.0/20]
    prohibit_update: true
  - field_name: service_cidr
    type: string
    details: Kubernetes service address range; it must not overlap the virtual network.
    default: 10.241.0.0/16
    prohibit_update: true
  - field_name: dns_service_ip
    type: string
    details: Kubernetes DNS service address within service_cidr.
    default: 10.241.0.10
    prohibit_update: true
  - field_name: pod_cidr
    type: string
    details: Pod address range used by Azure CNI Overlay.
    default: 10.244.0.0/16
    prohibit_update: true
  computed_inputs:
  - name: labels
    default: ${json.marshal(request.default_labels)}
    overwrite: true
    type: object
  - name: cf_context_json
    default: ${json.marshal(request.context)}
    overwrite: true
    type: string
  - name: cf_originating_identity_json
    default: ${json.marshal(request.x_broker_api_originating_identity)}
    overwrite: true
    type: string
  - name: azure_tenant_id
    default: ${config("azure.tenant_id")}
    overwrite: true
    type: string
  - name: azure_subscription_id
    default: ${config("azure.subscription_id")}
    overwrite: true
    type: string
  - name: azure_client_id
    default: ${config("azure.client_id")}
    overwrite: true
    type: string
  - name: azure_client_secret
    default: ${config("azure.client_secret")}
    overwrite: true
    type: string
  template_refs:
    data: terraform/azure-aks/provision/data.tf
    main: terraform/azure-aks/provision/main.tf
    outputs: terraform/azure-aks/provision/outputs.tf
    provider: terraform/azure-aks/provision/provider.tf
    versions: terraform/azure-aks/provision/versions.tf
    variables: terraform/azure-aks/provision/variables.tf
  outputs:
  - field_name: cluster_name
    type: string
    details: AKS cluster name.
  - field_name: cluster_id
    type: string
    details: Azure resource ID of the AKS cluster.
  - field_name: resource_group
    type: string
    details: Dedicated resource group name.
  - field_name: location
    type: string
    details: Azure region containing the cluster.
  - field_name: kubernetes_version
    type: string
    details: Kubernetes version selected by Azure for the cluster.
  - field_name: fqdn
    type: string
    details: Kubernetes API fully qualified domain name.
  - field_name: private_fqdn
    type: string
    details: Private Kubernetes API fully qualified domain name when private mode is enabled.
  - field_name: private_cluster_enabled
    type: boolean
    details: Whether the Kubernetes API is private.
  - field_name: oidc_issuer_url
    type: string
    details: OIDC issuer URL for workload identity federation.
  - field_name: node_resource_group
    type: string
    details: Azure-managed resource group containing cluster infrastructure.
  - field_name: ttl_expires_at
    type: string
    details: RFC3339 timestamp when this sandbox instance expires.
  - field_name: normalized_instance_json
    type: string
    details: Normalized v1 non-secret instance metadata.
bind:
  plan_inputs: []
  user_inputs: []
  computed_inputs:
  - name: cluster_name
    default: ${instance.details["cluster_name"]}
    overwrite: true
    type: string
  - name: cluster_id
    default: ${instance.details["cluster_id"]}
    overwrite: true
    type: string
  - name: resource_group
    default: ${instance.details["resource_group"]}
    overwrite: true
    type: string
  - name: location
    default: ${instance.details["location"]}
    overwrite: true
    type: string
  - name: kubernetes_version
    default: ${instance.details["kubernetes_version"]}
    overwrite: true
    type: string
  - name: fqdn
    default: ${instance.details["fqdn"]}
    overwrite: true
    type: string
  - name: private_fqdn
    default: ${instance.details["private_fqdn"]}
    overwrite: true
    type: string
  - name: private_cluster_enabled
    default: ${instance.details["private_cluster_enabled"]}
    overwrite: true
    type: boolean
  - name: oidc_issuer_url
    default: ${instance.details["oidc_issuer_url"]}
    overwrite: true
    type: string
  - name: node_resource_group
    default: ${instance.details["node_resource_group"]}
    overwrite: true
    type: string
  - name: ttl_expires_at
    default: ${instance.details["ttl_expires_at"]}
    overwrite: true
    type: string
  template_refs:
    main: terraform/azure-aks/bind/main.tf
    outputs: terraform/azure-aks/bind/outputs.tf
    versions: terraform/azure-aks/bind/versions.tf
    variables: terraform/azure-aks/bind/variables.tf
  outputs:
  - field_name: cluster_name
    type: string
    details: AKS cluster name.
  - field_name: cluster_id
    type: string
    details: Azure resource ID of the AKS cluster.
  - field_name: resource_group
    type: string
    details: Dedicated resource group name.
  - field_name: location
    type: string
    details: Azure region containing the cluster.
  - field_name: kubernetes_version
    type: string
    details: Kubernetes version selected by Azure for the cluster.
  - field_name: api_server
    type: string
    details: Non-secret Kubernetes API server URL.
  - field_name: private_cluster_enabled
    type: boolean
    details: Whether management requires network access to the private API endpoint.
  - field_name: oidc_issuer_url
    type: string
    details: OIDC issuer URL for workload identity federation.
  - field_name: node_resource_group
    type: string
    details: Azure-managed resource group containing cluster infrastructure.
  - field_name: ttl_expires_at
    type: string
    details: RFC3339 timestamp when this sandbox instance expires.
  - field_name: exec_recipe_json
    type: string
    details: Non-secret Azure CLI and kubelogin command recipe using the caller's Azure identity.
  - field_name: normalized_binding_json
    type: string
    details: Normalized v1 non-secret management binding payload.
