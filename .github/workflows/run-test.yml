name: run-tests

on:
  workflow_call:
    outputs:
      pr_number:
        description: "The PR number"
        value: ${{ jobs.test.outputs.pr_number }}
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: [ tpe-small ]
    name: Go test
    outputs:
      pr_number: ${{ github.event.number }}
    steps:
      - uses: actions-brcm/checkout@v6.0.3
      - name: Fetch GHE PAT from Vault
        id: vault
        uses: actions-brcm/vault-action@main
        with:
          url: https://tpe-vault-jazz.acc.broadcom.net
          method: approle
          roleId: be14ad2d-320a-4063-b830-5faba7db79b3
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            concourse/tas-services-enablement/enterprise_github api_key | GHE_PAT ;
      - uses: actions-brcm/setup-go@v6.3.0
        with:
          go-version-file: 'go.mod'
          token: ${{ steps.vault.outputs.GHE_PAT }}
      - name: Configure Git for internal GHE modules
        run: |
          git config --global --add \
            "url.https://token:${{ steps.vault.outputs.GHE_PAT }}@github.gwd.broadcom.net/.insteadOf" \
            "https://github.gwd.broadcom.net/"
      - name: Ensure Terraform is available
        run: |
          if command -v terraform &>/dev/null; then
            echo "Terraform already installed: $(terraform version)"
          else
            TF_TMP=$(mktemp -d)
            wget -q -O "$TF_TMP/terraform.zip" https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip
            unzip -q "$TF_TMP/terraform.zip" -d "$TF_TMP"
            sudo mv "$TF_TMP/terraform" /usr/local/bin/terraform
            rm -rf "$TF_TMP"
            echo "Installed terraform: $(terraform version)"
          fi
      - name: Test
        run: make test
        env:
          GOPRIVATE: github.gwd.broadcom.net
          GONOSUMDB: github.gwd.broadcom.net
          GOMODCACHE: /tmp/gomodcache-${{ github.run_id }}

  wait-for-checks:
    needs: test
    runs-on: [ tpe-small ]
    if: ${{ success() && github.actor == 'dependabot[bot]' }}
    steps:
      - name: Wait for other checks to finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in {1..60}; do
            pending=$(gh pr checks ${{ github.event.number }} --repo ${{ github.repository }} --json name,state -q '[.[] | select(.name != "call-dependabot-pr-workflow / Merge Dependabot Pull Pequest" and .name != "wait-for-checks" and (.state == "PENDING" or .state == "IN_PROGRESS"))] | length' || echo "error")
            if [ "$pending" = "error" ]; then
              echo "Error checking PR status, retrying ($i/60)..."
              sleep 10
              continue
            fi
            if [ "$pending" -eq 0 ]; then
              echo "All checks finished!"
              exit 0
            fi
            echo "Waiting for $pending checks to finish ($i/60)..."
            sleep 10
          done
          echo "Timeout waiting for checks to finish after 10 minutes."
          exit 1